<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoWallet - Secure Client-Side Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-3">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-wallet2"></i> CryptoWallet</span>
        <span id="navWalletInfo" class="text-light" style="display:none;">
            <small id="navWalletAddress" class="font-monospace text-info"></small>
        </span>
    </nav>

    <div class="container mt-4">
        <!-- Notification area -->
        <div id="notificationArea"></div>

        <!-- View: Create Wallet -->
        <div id="viewCreateWallet" class="view-section">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="bi bi-plus-circle"></i> Create New Wallet</h4>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="createPassphrase" class="form-label">Passphrase (minimum 8 characters)</label>
                                <input type="password" class="form-control" id="createPassphrase" placeholder="Enter passphrase">
                            </div>
                            <div class="mb-3">
                                <label for="createPassphraseConfirm" class="form-label">Confirm Passphrase</label>
                                <input type="password" class="form-control" id="createPassphraseConfirm" placeholder="Confirm passphrase">
                            </div>
                            <button class="btn btn-primary w-100" id="btnCreateWallet">
                                <i class="bi bi-shield-lock"></i> Create Wallet
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- View: Recover Wallet -->
        <div id="viewRecoverWallet" class="view-section" style="display:none;">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0"><i class="bi bi-arrow-counterclockwise"></i> Recover Wallet</h4>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="recoveryMnemonic" class="form-label">Mnemonic Phrase (12 words)</label>
                                <textarea class="form-control" id="recoveryMnemonic" rows="3" placeholder="Enter your 12-word mnemonic phrase separated by spaces"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="recoverPassphrase" class="form-label">New Passphrase</label>
                                <input type="password" class="form-control" id="recoverPassphrase" placeholder="Enter new passphrase">
                            </div>
                            <div class="mb-3">
                                <label for="recoverPassphraseConfirm" class="form-label">Confirm Passphrase</label>
                                <input type="password" class="form-control" id="recoverPassphraseConfirm" placeholder="Confirm passphrase">
                            </div>
                            <button class="btn btn-success w-100" id="btnRecoverWallet">
                                <i class="bi bi-arrow-counterclockwise"></i> Recover Wallet
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- View: Wallet Dashboard -->
        <div id="viewDashboard" class="view-section" style="display:none;">
            <div class="row">
                <div class="col-md-4">
                    <div class="card shadow mb-4">
                        <div class="card-header bg-info text-white">
                            <h5 class="mb-0"><i class="bi bi-person-walking"></i> Wallet Info</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-1"><strong>Address:</strong></p>
                            <p class="font-monospace small text-break" id="dashAddress"></p>
                            <hr>
                            <p class="mb-1"><strong>Public Key:</strong></p>
                            <p class="font-monospace small text-break" id="dashPublicKey"></p>
                        </div>
                    </div>
                    <div class="card shadow mb-4">
                        <div class="card-header bg-warning text-dark">
                            <h5 class="mb-0"><i class="bi bi-clock-history"></i> Recent Transactions</h5>
                        </div>
                        <div class="card-body p-0">
                            <div id="transactionHistory" class="list-group list-group-flush" style="max-height:300px; overflow-y:auto;">
                                <div class="list-group-item text-muted text-center">No transactions yet.</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <!-- Balance Card -->
                    <div class="card shadow mb-4">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="bi bi-currency-bitcoin"></i> Balance</h5>
                            <button class="btn btn-sm btn-outline-light" id="btnRefreshBalance">
                                <i class="bi bi-arrow-clockwise"></i> Refresh
                            </button>
                        </div>
                        <div class="card-body">
                            <h3 id="balanceDisplay" class="text-center">Loading...</h3>
                            <p class="text-muted text-center mb-0" id="balanceUsd"></p>
                        </div>
                    </div>

                    <!-- Send Transaction -->
                    <div class="card shadow mb-4">
                        <div class="card-header bg-danger text-white">
                            <h5 class="mb-0"><i class="bi bi-send"></i> Send Transaction</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="sendTo" class="form-label">Recipient Address</label>
                                <input type="text" class="form-control font-monospace" id="sendTo" placeholder="Recipient address">
                            </div>
                            <div class="mb-3">
                                <label for="sendAmount" class="form-label">Amount</label>
                                <input type="number" class="form-control" id="sendAmount" placeholder="0.00" step="0.00000001" min="0">
                            </div>
                            <div class="mb-3">
                                <label for="sendFee" class="form-label">Fee</label>
                                <input type="number" class="form-control" id="sendFee" placeholder="0.0001" step="0.00001" min="0">
                            </div>
                            <button class="btn btn-danger w-100" id="btnSendTransaction">
                                <i class="bi bi-send-fill"></i> Sign & Broadcast
                            </button>
                        </div>
                    </div>

                    <!-- Transaction Result -->
                    <div id="txResultArea" style="display:none;"></div>
                </div>
            </div>
        </div>

        <!-- View: Unlock Wallet -->
        <div id="viewUnlock" class="view-section" style="display:none;">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow">
                        <div class="card-header bg-dark text-white">
                            <h4 class="mb-0"><i class="bi bi-unlock"></i> Unlock Wallet</h4>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="unlockPassphrase" class="form-label">Passphrase</label>
                                <input type="password" class="form-control" id="unlockPassphrase" placeholder="Enter your passphrase">
                            </div>
                            <button class="btn btn-dark w-100" id="btnUnlockWallet">
                                <i class="bi bi-box-arrow-in-right"></i> Unlock
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation buttons -->
    <div class="container mt-2">
        <div class="d-flex justify-content-center gap-2">
            <button class="btn btn-outline-secondary btn-sm" id="btnShowCreate">Create Wallet</button>
            <button class="btn btn-outline-secondary btn-sm" id="btnShowRecover">Recover Wallet</button>
            <button class="btn btn-outline-secondary btn-sm" id="btnShowUnlock" style="display:none;">Unlock Wallet</button>
            <button class="btn btn-outline-danger btn-sm" id="btnLockWallet" style="display:none;">
                <i class="bi bi-lock"></i> Lock
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/eventBus.js"></script>
    <script src="js/cryptoEngine.js"></script>
    <script src="js/walletManager.js"></script>
    <script src="js/transactionManager.js"></script>
    <script src="js/uiManager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
