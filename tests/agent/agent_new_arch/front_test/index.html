<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Modular Wallet App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="main-header" class="bg-dark text-white p-3"></header>

    <!-- Main Container -->
    <main class="container-fluid my-4">
      <!-- Balance Summary -->
      <section id="balance-summary" class="row mb-4"></section>

      <!-- Tab Navigation -->
      <ul class="nav nav-tabs" id="walletTabs" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="overview-tab" data-bs-toggle="tab" data-bs-target="#overview" type="button">Overview</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="transactions-tab" data-bs-toggle="tab" data-bs-target="#transactions" type="button">Transactions</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="cards-tab" data-bs-toggle="tab" data-bs-target="#cards" type="button">Cards</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile" type="button">Profile</button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content" id="walletTabContent">
        <div class="tab-pane fade show active" id="overview">
          <div id="action-buttons" class="my-3"></div>
          <div id="recent-transactions" class="mt-4"></div>
        </div>
        <div class="tab-pane fade" id="transactions">
          <div id="full-transaction-list" class="mt-3"></div>
        </div>
        <div class="tab-pane fade" id="cards">
          <div id="cards-list" class="mt-3"></div>
        </div>
        <div class="tab-pane fade" id="profile">
          <div id="profile-info" class="mt-3"></div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer id="main-footer" class="bg-light text-center p-3 mt-auto"></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="./assets/js/header.js"></script>
  <script src="./assets/js/balance.js"></script>
  <script src="./assets/js/transactions.js"></script>
  <script src="./assets/js/cards.js"></script>
  <script src="./assets/js/profile.js"></script>
  <script src="./assets/js/actions.js"></script>
  <script src="./assets/js/footer.js"></script>
  <script src="./assets/js/main.js"></script>
</body>
</html>
