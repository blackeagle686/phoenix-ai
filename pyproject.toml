[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phx-ashborn"
version = "0.2.8"
description = "Advanced AI Infrastructure SDK for Agentic Applications"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "openai>=1.0.0",
    "markdown>=3.4.0",
    "beautifulsoup4>=4.11.0",
    "pypdf>=3.10.0",
    "python-docx>=0.8.11",
    "redis>=4.5.0",
    "celery>=5.3.0",
    "sqlalchemy>=2.0.0",
    "django>=5.0.0",
    "pandas",
    "openpyxl",
    "Pillow",
    "psutil",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pyserial>=3.5",
    "paho-mqtt>=1.6.0"
]

[project.optional-dependencies]
local = [
    "torch",
    "transformers",
    "accelerate",
    "bitsandbytes",
    "sentence-transformers>=2.2.0"
]
vector = [
    "chromadb>=0.4.0",
    "qdrant-client>=1.6.0"
]
audio = [
    "gTTS",
    "SpeechRecognition",
    "pydub"
]
full = [
    "torch",
    "transformers",
    "accelerate",
    "bitsandbytes",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "qdrant-client>=1.6.0",
    "gTTS",
    "SpeechRecognition",
    "pydub"
]

[tool.setuptools.packages.find]
include = ["phoenix*"]
